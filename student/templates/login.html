<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d12;
            position: relative;
            overflow: hidden;
        }

        /* Vibrant animated gradient mesh background */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 50%, rgba(255, 56, 129, 0.35) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(0, 230, 188, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(255, 184, 0, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(88, 86, 214, 0.3) 0%, transparent 50%);
            animation: meshMove 20s ease-in-out infinite;
        }

        @keyframes meshMove {
            0%, 100% { 
                transform: translate(0, 0) scale(1);
                filter: hue-rotate(0deg);
            }
            33% { 
                transform: translate(50px, -40px) scale(1.15);
                filter: hue-rotate(120deg);
            }
            66% { 
                transform: translate(-40px, 50px) scale(0.95);
                filter: hue-rotate(240deg);
            }
        }

        /* Glassmorphism container */
        .login-container {
            position: relative;
            background: rgba(15, 15, 20, 0.75);
            backdrop-filter: blur(50px) saturate(200%);
            -webkit-backdrop-filter: blur(50px) saturate(200%);
            border-radius: 36px;
            padding: 56px 48px;
            width: 440px;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 12px 40px 0 rgba(0, 0, 0, 0.5),
                inset 0 2px 0 0 rgba(255, 255, 255, 0.08);
            animation: containerFloat 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes containerFloat {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Vibrant glow effect */
        .login-container::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, 
                rgba(255, 56, 129, 0.6), 
                rgba(0, 230, 188, 0.6), 
                rgba(255, 184, 0, 0.5),
                rgba(88, 86, 214, 0.6));
            border-radius: 36px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
            filter: blur(25px);
        }

        .login-container:hover::before {
            opacity: 0.7;
        }

        h2 {
            color: #ffffff;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ff3881 0%, #00e6bc 50%, #ffb800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% auto;
            animation: gradientShift 3s linear infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .input-group {
            position: relative;
            margin-bottom: 28px;
        }

        .input-group input {
            width: 100%;
            padding: 18px 24px;
            font-size: 15px;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            outline: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(0, 230, 188, 0.7);
            box-shadow: 
                0 0 0 4px rgba(0, 230, 188, 0.15),
                0 8px 24px rgba(0, 230, 188, 0.3);
            transform: translateY(-2px);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-group label {
            position: absolute;
            left: 24px;
            top: 18px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 15px;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: -12px;
            left: 20px;
            font-size: 12px;
            background: linear-gradient(to bottom, transparent 0%, rgba(15, 15, 20, 0.9) 30%, rgba(15, 15, 20, 0.9) 70%, transparent 100%);
            padding: 0 8px;
            color: #00e6bc;
            font-weight: 600;
        }

        button[type="submit"] {
            width: 100%;
            padding: 18px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #ff3881 0%, #00e6bc 100%);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 4px 24px rgba(255, 56, 129, 0.4),
                0 4px 24px rgba(0, 230, 188, 0.3),
                inset 0 2px 0 0 rgba(255, 255, 255, 0.25);
            position: relative;
            overflow: hidden;
            margin-top: 8px;
            background-size: 200% auto;
        }

        button[type="submit"]::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s;
        }

        button[type="submit"]:hover::before {
            left: 100%;
        }

        button[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 8px 36px rgba(255, 56, 129, 0.6),
                0 8px 36px rgba(0, 230, 188, 0.5),
                inset 0 2px 0 0 rgba(255, 255, 255, 0.3);
            background-position: 100% center;
        }

        button[type="submit"]:active {
            transform: translateY(-1px);
        }

        .forgot-password {
            text-align: center;
            margin-top: 24px;
        }

        .forgot-password a {
            color: rgba(0, 230, 188, 0.95);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            position: relative;
        }

        .forgot-password a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1.5px;
            bottom: -3px;
            left: 50%;
            background: linear-gradient(90deg, transparent, #00e6bc, #ff3881, transparent);
            transition: all 0.3s;
        }

        .forgot-password a:hover {
            color: #00ffcc;
        }

        .forgot-password a:hover::after {
            width: 100%;
            left: 0;
        }

        /* Floating orbs with vibrant colors */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.5;
            animation: orbFloat 10s ease-in-out infinite;
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255, 56, 129, 0.7), transparent);
            top: -175px;
            right: -175px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 230, 188, 0.6), transparent);
            bottom: -150px;
            left: -150px;
            animation-delay: 3s;
        }

        .orb-3 {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(255, 184, 0, 0.5), transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 6s;
        }

        @keyframes orbFloat {
            0%, 100% { 
                transform: translate(0, 0) scale(1);
            }
            50% { 
                transform: translate(30px, -30px) scale(1.2);
            }
        }

        /* Decorative particles with vibrant colors */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: particleFloat 8s linear infinite;
        }

        .particle:nth-child(1) { 
            top: 15%; 
            left: 10%; 
            background: rgba(255, 56, 129, 0.8);
            animation-delay: 0s; 
        }
        .particle:nth-child(2) { 
            top: 65%; 
            left: 85%; 
            background: rgba(0, 230, 188, 0.8);
            animation-delay: 2.5s; 
        }
        .particle:nth-child(3) { 
            top: 35%; 
            left: 90%; 
            background: rgba(255, 184, 0, 0.8);
            animation-delay: 5s; 
        }

        @keyframes particleFloat {
            0% { 
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% { 
                transform: translateY(-120px) translateX(30px) scale(0.5);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                width: 90%;
                padding: 44px 32px;
                border-radius: 32px;
            }

            h2 {
                font-size: 32px;
            }

            .input-group input {
                padding: 16px 20px;
            }

            button[type="submit"] {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="login-container">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    
    <h2>Welcome Back</h2>
    <p class="subtitle">Please login to continue</p>

    <form method="POST"  action="{% url 'login' %}">
        {% csrf_token %}


        <div class="input-group">
            <input type="text" name="username" placeholder=" " required>
            <label>Username</label>
        </div>

        <div class="input-group">
            <input type="password" name="password" placeholder=" " required>
            <label>Password</label>
        </div>
        
        <button type="submit">Login</button>

        <div class="forgot-password">
            <a href="#">Forgot password?</a>
        </div>
    </form>
</div>

</body>
</html>
